<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d2738">
<title>Nación Vera | Menú editable</title>
<style>
:root{--navy:#0d2738;--navy2:#091c29;--cream:#f6f0e7;--gold:#e7b24a;--orange:#d86f34;--ink:#13212b;--muted:#68757e;--card:#fff;--danger:#b63636}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink);background:#f4f1eb}
a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit}
.hero{min-height:82vh;display:grid;place-items:center;text-align:center;color:white;background:linear-gradient(180deg,rgba(5,18,27,.34),rgba(5,18,27,.90)),url('') center/cover;padding:32px 20px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:auto -10% -90px;width:120%;height:180px;background:#f4f1eb;border-radius:50% 50% 0 0/35% 35% 0 0}
.hero-inner{position:relative;z-index:1;max-width:820px}.eyebrow{letter-spacing:.22em;text-transform:uppercase;font-weight:800;font-size:.78rem;color:#f0cc86}
h1{font-size:clamp(3.2rem,11vw,7rem);line-height:.85;margin:.25em 0 .18em;letter-spacing:-.055em}.tagline{font-size:clamp(1.1rem,3vw,1.7rem);font-weight:700;margin:0 0 28px}
.cta{display:inline-flex;align-items:center;background:var(--gold);color:#13212b;font-weight:900;padding:14px 20px;border-radius:999px;border:0;cursor:pointer}
nav{position:sticky;top:0;z-index:20;background:rgba(9,28,41,.94);backdrop-filter:blur(10px);overflow:auto;white-space:nowrap;border-bottom:1px solid rgba(255,255,255,.1)}
nav .wrap{display:flex;gap:10px;padding:10px 16px;justify-content:center}nav a{color:white;padding:9px 14px;border-radius:999px;font-size:.9rem;font-weight:750}
main{max-width:1120px;margin:auto;padding:54px 20px 120px}.intro{max-width:780px;margin:0 auto 56px;text-align:center}
.intro h2,.section h2{font-size:clamp(2rem,5vw,3.7rem);margin:0 0 12px;letter-spacing:-.045em}.intro p{font-size:1.1rem;line-height:1.75;color:#4c5a63}
.section{scroll-margin-top:78px;margin:70px 0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.card{background:var(--card);border-radius:24px;overflow:hidden;box-shadow:0 16px 48px rgba(16,33,45,.10);border:1px solid rgba(13,39,56,.07);position:relative}
.card img{width:100%;height:250px;object-fit:cover;display:block}.card-body{padding:22px}.item-top{display:flex;justify-content:space-between;gap:16px;align-items:start}
.item-top h3{font-size:1.45rem;margin:0}.price{font-size:1.32rem;font-weight:950;color:var(--orange);white-space:nowrap}.desc{color:#5a6871;line-height:1.65;margin-bottom:0}
.footer-hero{min-height:460px;border-radius:30px;background:linear-gradient(rgba(9,28,41,.55),rgba(9,28,41,.88)),url('') center/cover;display:flex;align-items:end;padding:34px;color:white}
.footer-hero h2{font-size:clamp(2rem,6vw,4.4rem);max-width:760px;margin:0}.small{font-size:.88rem;color:#66737b;text-align:center;margin-top:18px}
.orderbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:30;width:min(92%,680px);display:flex;gap:10px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);padding:10px;border-radius:999px;box-shadow:0 12px 42px rgba(0,0,0,.22)}
.orderbar a{flex:1;text-align:center;padding:13px 14px;border-radius:999px;font-weight:900}.wa{background:#25D366;color:#072d17}.ig{background:var(--navy);color:white}
.edit-fab{position:fixed;right:18px;top:18px;z-index:60;border:0;border-radius:999px;padding:12px 16px;font-weight:900;background:var(--gold);cursor:pointer;box-shadow:0 10px 28px rgba(0,0,0,.23)}
.editor{position:fixed;inset:0;z-index:100;background:rgba(5,16,23,.75);display:none;padding:18px;overflow:auto}.editor.open{display:block}
.editor-panel{max-width:920px;margin:20px auto;background:#fff;border-radius:24px;padding:24px;box-shadow:0 24px 80px rgba(0,0,0,.35)}
.editor-head{display:flex;justify-content:space-between;gap:16px;align-items:center}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 22px}
.primary,.secondary,.danger{border:0;border-radius:12px;padding:11px 14px;font-weight:850;cursor:pointer}.primary{background:var(--navy);color:white}.secondary{background:#edf1f3}.danger{background:#f9e5e5;color:var(--danger)}
.product-admin{border:1px solid #dce3e7;border-radius:16px;padding:14px;margin:12px 0;background:#fafcfd}.product-admin-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}
.field label{font-weight:800;font-size:.9rem}.field input,.field textarea,.field select{width:100%;border:1px solid #cad3d9;border-radius:12px;padding:11px 12px}.field textarea{min-height:92px}
.preview-thumb{width:130px;height:85px;object-fit:cover;border-radius:10px;border:1px solid #ddd;margin-top:8px}
@media(max-width:760px){nav .wrap{justify-content:flex-start}.grid,.form-grid{grid-template-columns:1fr}.section-head{display:block}.card img{height:220px}.edit-fab{top:auto;bottom:90px}.field.full{grid-column:auto}}

.login-overlay{position:fixed;inset:0;z-index:120;background:rgba(5,16,23,.78);display:none;padding:18px;place-items:center}
.login-overlay.open{display:grid}
.login-card{width:min(92vw,430px);background:#fff;border-radius:24px;padding:26px;box-shadow:0 24px 80px rgba(0,0,0,.35)}
.login-card h2{margin:0 0 8px;font-size:1.8rem}.login-card p{color:var(--muted);line-height:1.5}
.login-card .field{margin:13px 0}.login-actions{display:flex;gap:10px;margin-top:18px}
.status{padding:10px 12px;border-radius:12px;background:#edf1f3;font-size:.9rem;margin:10px 0;display:none}
.status.show{display:block}.status.error{background:#f9e5e5;color:var(--danger)}
.status.ok{background:#e7f5ec;color:#17663a}
#logoutBtn{margin-left:auto}

</style>
</head>
<body>
<button class="edit-fab" id="editBtn">✏️ Editar menú</button>
<header class="hero"><div class="hero-inner"><div class="eyebrow">El secreto · El origen</div><h1>NACIÓN<br>VERA</h1><p class="tagline" id="tagline"></p><button class="cta" onclick="document.querySelector('#burgers').scrollIntoView()">Ver menú ↓</button></div></header>
<nav><div class="wrap" id="nav"></div></nav>
<main><section class="intro"><h2>Un menú irresistible</h2><p id="intro"></p></section><div id="menu"></div><section class="footer-hero"><h2>Sabor que se queda en tu memoria…</h2></section><p class="small" id="note"></p></main>
<div class="orderbar"><a class="ig" id="ig" target="_blank"></a><a class="wa" id="wa" target="_blank">Pedir por WhatsApp</a></div>


<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <h2>Administrador</h2>
    <p>Inicia sesión para editar y publicar el menú de Nación Vera.</p>
    <form id="loginForm">
      <div class="field"><label>Correo</label><input id="loginEmail" type="email" autocomplete="username" required></div>
      <div class="field"><label>Contraseña</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
      <div class="status" id="loginStatus"></div>
      <div class="login-actions">
        <button class="primary" type="submit">Iniciar sesión</button>
        <button class="secondary" type="button" id="cancelLogin">Cancelar</button>
      </div>
    </form>
  </div>
</div>

<div class="editor" id="editor"><div class="editor-panel">
<div class="editor-head"><h2>Editor del menú</h2><button class="secondary" id="closeBtn">Cerrar ✕</button></div>
<div class="toolbar">
<button class="primary" id="addBtn">+ Agregar producto</button>
<button class="primary" id="publishBtn">🚀 Publicar menú</button>
<button class="secondary" id="businessBtn">Información general</button>
<button class="secondary" id="exportBtn">Exportar copia</button>
<button class="secondary" id="importBtn">Importar copia</button>
<button class="danger" id="resetBtn">Restaurar original</button>
<button class="secondary" id="logoutBtn">Cerrar sesión</button>
<input type="file" id="importFile" accept=".json" hidden>
</div>
<div class="status" id="publishStatus"></div><div id="admin"></div>
</div></div>

let data=structuredClone(DEFAULT);
let session=null;

function safe(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function money(v){return "$"+Number(v||0).toFixed(2);}
function setStatus(id,msg,type=""){
  const el=document.getElementById(id); if(!el)return;
  el.textContent=msg; el.className="status show"+(type?" "+type:"");
}
function clearStatus(id){const el=document.getElementById(id);if(el){el.textContent="";el.className="status";}}

function render(){
 document.getElementById("tagline").textContent=data.business.tagline||"";
 document.getElementById("intro").textContent=data.business.intro||"";
 document.getElementById("ig").href=data.business.instagram||"#";
 document.getElementById("ig").textContent=data.business.instagramLabel||"Instagram";
 document.getElementById("wa").href=`https://wa.me/${data.business.whatsapp||""}?text=${encodeURIComponent("Hola Nación Vera, quiero hacer un pedido.")}`;
 document.getElementById("note").textContent=`Nación Vera llega hasta la puerta de tu hogar · ${data.business.delivery||""} · ${data.business.tax||""}.`;
 document.getElementById("nav").innerHTML=data.categories.map(c=>`<a href="#${safe(c.id)}">${safe(c.name)}</a>`).join("");
 document.getElementById("menu").innerHTML=data.categories.map(c=>{
  const ps=data.products.filter(p=>p.category===c.id);
  return `<section class="section" id="${safe(c.id)}"><div class="section-head"><div><div class="eyebrow" style="color:var(--orange)">${safe(c.subtitle)}</div><h2>${safe(c.name)}</h2></div></div><div class="grid">${ps.map(p=>`<article class="card">${p.image?`<img src="${safe(p.image)}" alt="${safe(p.name)}">`:""}<div class="card-body"><div class="item-top"><h3>${safe(p.name)}</h3><div class="price">${money(p.price)}</div></div>${p.description?`<p class="desc">${safe(p.description)}</p>`:""}</div></article>`).join("")}</div></section>`;
 }).join("");
}

async function loadPublishedMenu(){
  try{
    const [settingsRes,catsRes,productsRes]=await Promise.all([
      sb.from("menu_settings").select("*").order("id",{ascending:true}).limit(1),
      sb.from("categories").select("*").order("sort_order",{ascending:true}),
      sb.from("products").select("*").order("sort_order",{ascending:true})
    ]);
    if(settingsRes.error) throw settingsRes.error;
    if(catsRes.error) throw catsRes.error;
    if(productsRes.error) throw productsRes.error;

    // If Supabase is still empty, keep the complete original menu embedded in this file.
    if((settingsRes.data?.length||0)+(catsRes.data?.length||0)+(productsRes.data?.length||0)===0){
      data=structuredClone(DEFAULT); render(); return;
    }

    const s=settingsRes.data?.[0];
    data={
      business:s?{
        tagline:s.tagline||"", intro:s.intro||"", instagram:s.instagram||"",
        instagramLabel:s.instagram_label||"", whatsapp:s.whatsapp||"",
        delivery:s.delivery||"", tax:s.tax||""
      }:structuredClone(DEFAULT.business),
      categories:(catsRes.data||[]).map(c=>({id:c.id,name:c.name,subtitle:c.subtitle||""})),
      products:(productsRes.data||[]).map(p=>({
        id:p.id,category:p.category,name:p.name,price:String(p.price??0),
        description:p.description||"",image:p.image_url||""
      }))
    };
    render();
  }catch(err){
    console.error("Supabase load error:",err);
    data=structuredClone(DEFAULT);
    render();
  }
}

}

function fileToOptimizedDataUrl(file){
 return new Promise((resolve,reject)=>{
   const reader=new FileReader();
   reader.onerror=()=>reject(new Error("No se pudo leer la imagen."));
   reader.onload=()=>{
     const img=new Image();
     img.onerror=()=>reject(new Error("La imagen no se pudo abrir."));
     img.onload=()=>{
       const maxWidth=1400,maxHeight=1000;
       let w=img.width,h=img.height;
       const scale=Math.min(1,maxWidth/w,maxHeight/h);
       w=Math.round(w*scale);h=Math.round(h*scale);
       const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
       canvas.getContext("2d").drawImage(img,0,0,w,h);
       const type=file.type==="image/png"?"image/png":file.type==="image/webp"?"image/webp":"image/jpeg";
       resolve(canvas.toDataURL(type,type==="image/png"?0.92:0.84));
     };
     img.src=reader.result;
   };
   reader.readAsDataURL(file);
 });
}

function productForm(id=null){
 const p=id?data.products.find(x=>x.id===id):{id:crypto.randomUUID(),category:data.categories[0]?.id||"",name:"",price:"",description:"",image:""};
 document.getElementById("admin").innerHTML=`<h3>${id?"Editar":"Agregar"} producto</h3><form id="pf" class="form-grid">
 <div class="field"><label>Nombre</label><input name="name" required value="${safe(p.name)}"></div>
 <div class="field"><label>Precio</label><input name="price" type="number" step=".01" min="0" required value="${safe(p.price)}"></div>
 <div class="field"><label>Categoría</label><select name="category">${data.categories.map(c=>`<option value="${safe(c.id)}" ${c.id===p.category?"selected":""}>${safe(c.name)}</option>`).join("")}</select></div>
 <div class="field"><label>Imagen actual o URL</label><input name="image" id="imageUrl" value="${safe(p.image)}" placeholder="https://..."></div>
 <div class="field"><label>Subir una foto nueva</label><input type="file" id="imageFile" accept="image/png,image/jpeg,image/webp"><small>JPG, PNG o WebP. Máximo 5 MB. Se subirá a Supabase al publicar.</small></div>
 <div class="field full"><label>Vista previa</label><img id="imagePreview" class="preview-thumb" src="${safe(p.image)}" alt="Vista previa" onerror="this.style.display='none'" onload="this.style.display='block'"></div>
 <div class="field full"><label>Descripción</label><textarea name="description">${safe(p.description)}</textarea></div>
 <div class="field full"><button class="primary">Guardar cambio</button> <button type="button" class="secondary" onclick="adminList()">Cancelar</button></div></form>`;
 const imageFile=document.getElementById("imageFile"), imageUrl=document.getElementById("imageUrl"), imagePreview=document.getElementById("imagePreview");
 imageUrl.addEventListener("input",()=>{imagePreview.src=imageUrl.value;});
 imageFile.addEventListener("change",async()=>{
   const file=imageFile.files[0];if(!file)return;
   if(!["image/jpeg","image/png","image/webp"].includes(file.type)){alert("Usa JPG, PNG o WebP.");imageFile.value="";return;}
   if(file.size>5*1024*1024){alert("La imagen supera el límite de 5 MB.");imageFile.value="";return;}
   try{const dataUrl=await fileToOptimizedDataUrl(file);imageUrl.value=dataUrl;imagePreview.src=dataUrl;}catch(e){alert(e.message);}
 });
 document.getElementById("pf").onsubmit=e=>{
   e.preventDefault();const o=Object.fromEntries(new FormData(e.target).entries());delete o.imageFile;
   if(id)Object.assign(p,o);else data.products.push({...p,...o});
   render();adminList();
 };
}

function dataUrlToBlob(dataUrl){
 const [head,body]=dataUrl.split(",");
 const mime=(head.match(/data:([^;]+)/)||[])[1]||"image/jpeg";
 const bytes=atob(body), arr=new Uint8Array(bytes.length);
 for(let i=0;i<bytes.length;i++)arr[i]=bytes.charCodeAt(i);
 return new Blob([arr],{type:mime});
}
async function uploadEmbeddedImage(product){
 if(!product.image?.startsWith("data:image/")) return product.image||"";
 const blob=dataUrlToBlob(product.image);
 const ext=blob.type==="image/png"?"png":blob.type==="image/webp"?"webp":"jpg";
 const path=`products/${product.id}-${Date.now()}.${ext}`;
 const {error}=await sb.storage.from("menu-images").upload(path,blob,{contentType:blob.type,upsert:false});
 if(error) throw error;
 const {data:pub}=sb.storage.from("menu-images").getPublicUrl(path);
 return pub.publicUrl;
}

async function publish(){
 if(!session || session.user.id!==ADMIN_UID){alert("Tu sesión de administrador no es válida.");return;}
 const btn=document.getElementById("publishBtn");btn.disabled=true;
 setStatus("publishStatus","Publicando cambios y fotografías…");
 try{
   // Upload any embedded/new local images first.
   for(const p of data.products){
     if(p.image?.startsWith("data:image/")) p.image=await uploadEmbeddedImage(p);
   }

   const b=data.business;
   const {error:se}=await sb.from("menu_settings").upsert({
     id:1,tagline:b.tagline,intro:b.intro,instagram:b.instagram,
     instagram_label:b.instagramLabel,whatsapp:b.whatsapp,
     delivery:b.delivery,tax:b.tax,updated_at:new Date().toISOString()
   },{onConflict:"id"});
   if(se)throw se;

   const cats=data.categories.map((c,i)=>({id:c.id,name:c.name,subtitle:c.subtitle||"",sort_order:i,updated_at:new Date().toISOString()}));
   if(cats.length){const {error}=await sb.from("categories").upsert(cats,{onConflict:"id"});if(error)throw error;}

   const prods=data.products.map((p,i)=>({
     id:p.id,category:p.category,name:p.name,price:Number(p.price||0),
     description:p.description||"",image_url:p.image||"",sort_order:i,updated_at:new Date().toISOString()
   }));
   if(prods.length){const {error}=await sb.from("products").upsert(prods,{onConflict:"id"});if(error)throw error;}

   // Remove database rows no longer present in the editor.
   const {data:dbProducts,error:dpe}=await sb.from("products").select("id");if(dpe)throw dpe;
   const keepProducts=new Set(data.products.map(p=>p.id));
   const removeProducts=(dbProducts||[]).filter(x=>!keepProducts.has(x.id)).map(x=>x.id);
   if(removeProducts.length){const {error}=await sb.from("products").delete().in("id",removeProducts);if(error)throw error;}

   const {data:dbCats,error:dce}=await sb.from("categories").select("id");if(dce)throw dce;
   const keepCats=new Set(data.categories.map(c=>c.id));
   const removeCats=(dbCats||[]).filter(x=>!keepCats.has(x.id)).map(x=>x.id);
   if(removeCats.length){const {error}=await sb.from("categories").delete().in("id",removeCats);if(error)throw error;}

   render();adminList();
   setStatus("publishStatus","✓ Menú publicado correctamente. Los visitantes ya recibirán esta versión.","ok");
 }catch(err){
   console.error(err);
   setStatus("publishStatus","Error al publicar: "+(err.message||String(err)),"error");
 }finally{btn.disabled=false;}
}

 }

}
